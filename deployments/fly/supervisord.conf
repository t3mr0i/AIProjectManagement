[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:postgres]
command=/bin/sh -c 'if [ "$RUN_LOCAL_POSTGRES" = "true" ]; then exec su-exec postgres postgres -D "$PGDATA" -c listen_addresses=127.0.0.1; else sleep infinity; fi'
priority=1
autorestart=true
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=/bin/sh -c 'if [ "$RUN_LOCAL_REDIS" = "true" ]; then exec redis-server --bind 127.0.0.1 --port 6379 --dir /data/redis --save 60 1 --appendonly no; else sleep infinity; fi'
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:migrator]
directory=/app/backend
command=/app/backend/bin/docker-entrypoint-migrator.sh
priority=5
autorestart=unexpected
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
directory=/app/backend
command=/app/backend/bin/docker-entrypoint-api.sh
environment=PORT="8000"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
directory=/app/backend
command=/app/backend/bin/docker-entrypoint-worker.sh
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:beat]
directory=/app/backend
command=/app/backend/bin/docker-entrypoint-beat.sh
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:live]
directory=/app/node/apps/live
command=node .
environment=PORT="3100",HOSTNAME="127.0.0.1"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:space]
directory=/app/node/apps/space
command=/app/node/apps/space/node_modules/.bin/react-router-serve ./build/server/index.js
environment=PORT="3002",HOST="127.0.0.1",NODE_ENV="production"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
command=caddy run --config /app/Caddyfile --adapter caddyfile
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
