[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "project-hub-runner"
version = "0.1.0"
description = "External runner/CLI for the Project Hub package flow (Plane extension). Connects outbound only; stdlib-only runtime."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ph-runner = "project_hub_runner.cli:main"

[tool.setuptools.packages.find]
include = ["project_hub_runner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S603", "S607", "S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
