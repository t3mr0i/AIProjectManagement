# Fly.io configuration for the single-container Plane deployment.
# See deployments/fly/README.md for setup.
app = "ai-project-management"
primary_region = "fra"

[build]
  dockerfile = "deployments/fly/Dockerfile"

[env]
  GUNICORN_WORKERS = "2"
  FILE_SIZE_LIMIT = "10485760"

[mounts]
  source = "plane_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "120s"
    interval = "30s"
    method = "GET"
    path = "/api/instances/"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
